<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cardiac Sensor — Fan Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050000;overflow:hidden;font-family:Arial,sans-serif}
#app{position:fixed;inset:0;background:#080000;color:white}
#camera{position:absolute;width:100%;height:100%;object-fit:cover;display:none;filter:saturate(.55) contrast(1.05) brightness(.72)}
#tint{position:absolute;inset:0;background:rgba(105,0,0,.34);display:none;pointer-events:none}
#game{position:absolute;inset:0;background:
radial-gradient(circle at 50% 50%,rgba(145,0,0,.28),rgba(35,0,0,.7) 55%,rgba(0,0,0,.9));
}
#game:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);pointer-events:none}
#circle{position:absolute;width:min(52vw,280px);height:min(52vw,280px);border:4px solid rgba(255,225,230,.92);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 5px #fff,0 0 14px rgba(255,210,215,.4)}
#sweep{position:absolute;left:50%;top:50%;width:min(26vw,140px);height:2px;transform-origin:left center;background:linear-gradient(90deg,#ff9b9b,transparent);box-shadow:0 0 8px #ff7777}
.target{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff2020;box-shadow:0 0 8px 4px #ff3030;animation:p .55s infinite alternate}
@keyframes p{to{opacity:.55;transform:scale(1.35)}}
.label{position:absolute;font:10px monospace;color:#eee;text-shadow:0 1px 4px #000}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;font:11px monospace;z-index:10}
#bottom{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;z-index:10}
#readout{font:12px monospace;line-height:1.6}.big{font-size:26px;font-weight:bold}
button{border:1px solid #aaa;background:rgba(0,0,0,.65);color:#fff;border-radius:7px;padding:11px 14px;font-weight:bold}
#start{border-color:#ff7777}
#message{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);padding:22px;background:rgba(0,0,0,.94);border:1px solid #777;border-radius:12px;text-align:center;line-height:1.45}
#message p{font-size:13px;color:#ccc}#error{color:#ff7777;font-size:12px;display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video><div id="tint"></div><div id="game"></div>
<div id="circle"></div><div id="sweep"></div>
<div id="top"><span>CARDIAC SENSOR</span><span id="state">READY</span></div>
<div id="bottom">
  <div id="readout"><div class="big" id="dist">-- M</div><div id="heart">NO HEARTBEAT</div></div>
  <div><button id="start">START</button></div>
</div>
<div id="message">
  <b>CAMERA MODE</b>
  <p>This fan-made simulator uses your phone camera as the background and adds a Siege-inspired sensor overlay.</p>
  <p id="error"></p>
  <button id="continue">CONTINUE</button>
</div>
</div>
<script>
const video=document.getElementById('camera'), tint=document.getElementById('tint'), game=document.getElementById('game');
const circle=document.getElementById('circle'), sweep=document.getElementById('sweep'), state=document.getElementById('state');
const dist=document.getElementById('dist'), heart=document.getElementById('heart');
const msg=document.getElementById('message'), err=document.getElementById('error');
let stream=null, cameraOn=false, scanning=false, angle=0, last=performance.now(), target=null, beat=0;

async function enableCamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    err.textContent='Camera access is unavailable in this browser/context. iPhone Safari normally requires the page to be served over HTTPS.';
    err.style.display='block'; return false;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream; await video.play();
    video.style.display='block'; tint.style.display='block'; game.style.background='transparent';
    cameraOn=true; msg.classList.add('hidden'); state.textContent='CAMERA READY'; return true;
  }catch(e){
    err.textContent='Camera permission was denied or unavailable. Allow Camera access and try again.';
    err.style.display='block'; return false;
  }
}
document.getElementById('continue').onclick=enableCamera;

document.getElementById('start').onclick=async()=>{
  if(!cameraOn){if(!(await enableCamera()))return}
  scanning=!scanning; document.getElementById('start').textContent=scanning?'STOP':'START';
  state.textContent=scanning?'SCANNING':'CAMERA READY';
  if(!scanning) removeTarget();
};

function removeTarget(){
 if(target){target.remove();target=null}
 dist.textContent='-- M';heart.textContent='NO HEARTBEAT';
}
function spawnTarget(){
 removeTarget();
 target=document.createElement('div');target.className='target';
 const c=circle.getBoundingClientRect();
 const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*(c.width*.44);
 target.style.left=(c.left+c.width/2+Math.cos(a)*r-5)+'px';
 target.style.top=(c.top+c.height/2+Math.sin(a)*r-5)+'px';
 document.getElementById('app').appendChild(target);
 dist.textContent=Math.max(1,Math.round(r/(c.width*.44)*12))+' M';
 heart.textContent=(65+Math.floor(Math.random()*45))+' BPM';
 if(navigator.vibrate)navigator.vibrate(40);
}
function loop(t){
 const dt=t-last;last=t;
 if(scanning){
   angle=(angle+dt*.18)%360; sweep.style.transform=`rotate(${angle}deg)`;
   if(!target && Math.random()<.003)spawnTarget();
   if(target && Math.random()<.001)removeTarget();
 } else sweep.style.transform=`rotate(${angle}deg)`;
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
